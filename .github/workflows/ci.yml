name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vda
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vda" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend checks
        timeout-minutes: 4
        env:
          PYTHONUNBUFFERED: '1'
          TEST_POSTGRES_URL: postgresql+psycopg://vda:ci-only-password@127.0.0.1:5432/vda
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          python -m pip install uv==0.13.6
          uv sync --frozen --group dev
          uv run ruff check backend scripts
          uv run pytest -vv -o faulthandler_timeout=30
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build and smoke the application image
        run: |
          python scripts/check_build_context.py
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%FT%TZ)" -t vda:check .
          bash scripts/image-smoke.sh vda:check "$GITHUB_SHA"
          bash scripts/compose-smoke.sh vda:check
