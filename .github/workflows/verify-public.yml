name: Verify public GHCR image (manual)
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image tag or digest in ghcr.io/compcj/vibe-domain-agent
        required: true
        default: ghcr.io/compcj/vibe-domain-agent:latest
        type: string

permissions:
  contents: read

jobs:
  anonymous-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Anonymous pull and startup verification
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr.io/compcj/vibe-domain-agent(:latest|:sha-[a-f0-9]{40}|@sha256:[a-f0-9]{64})$ ]]
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          docker pull "$IMAGE"
          revision="$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          bash scripts/image-smoke.sh "$digest" "$revision"
          {
            echo '## Anonymous GHCR validation passed'
            echo "- Image: \`$digest\`"
            echo "- Source: \`$revision\`"
            echo '- Used an empty Docker configuration with no registry login.'
          } >> "$GITHUB_STEP_SUMMARY"
