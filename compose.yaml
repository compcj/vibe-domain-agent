name: vibe-domain-agent

x-application: &application
  image: ${APP_IMAGE:-ghcr.io/compcj/vibe-domain-agent:latest}
  platform: linux/amd64
  restart: unless-stopped
  environment: &environment
    APP_ENV: ${APP_ENV:-production}
    SECRET_KEY: ${SECRET_KEY:?Generate .env first}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate .env first}
    DATABASE_URL: postgresql+psycopg://vda:${POSTGRES_PASSWORD:?Generate .env first}@db:5432/vda
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /app/data/files
    FRONTEND_DIST: /app/frontend/dist
  volumes:
    - app_data:/app/data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '5'

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vda
      POSTGRES_USER: vda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vda -d vda']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *application
    restart: 'no'
    command: [migrate]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *application
    command: [api]
  worker:
    <<: *application
    command: [worker]
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.worker.celery_app inspect ping -d runs@$$HOSTNAME --timeout=5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  indexer:
    <<: *application
    command: [indexer]
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.worker.celery_app inspect ping -d indexing@$$HOSTNAME --timeout=5 | grep -q pong']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  beat:
    <<: *application
    command: [beat]
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; command = Path('/proc/1/cmdline').read_bytes(); assert b'celery' in command and b'beat' in command; assert any(Path('/app/data').glob('celerybeat-schedule*'))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_data:
