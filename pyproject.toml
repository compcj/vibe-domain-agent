[project]
name = "vibe-domain-agent"
version = "0.1.0"
description = "Self-hosted domain agents with server-managed capabilities"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.3,<1",
  "celery[redis]>=5.4,<6", "redis>=5.2,<7", "httpx>=0.28,<1",
  "cryptography>=44,<50", "argon2-cffi>=23,<26", "python-multipart>=0.0.20,<1",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=2,<4",
  "langgraph-checkpoint-sqlite>=2,<4", "mcp>=1.12,<2", "jsonschema>=4.23,<5",
  "pypdf>=6,<10", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
